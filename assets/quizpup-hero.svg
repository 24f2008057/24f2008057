<svg xmlns="http://www.w3.org/2000/svg" width="900" height="280" viewBox="0 0 900 280" role="img" aria-label="QuizPup featured project" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="0.55" stop-color="#16213e"/>
      <stop offset="1" stop-color="#2d1b69"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58a6ff"/>
      <stop offset="1" stop-color="#a371f7"/>
    </linearGradient>
    <style>
      text { font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .border { stroke-dasharray: 14 10; animation: march 2.4s linear infinite; }
      .orb1 { animation: float 6s ease-in-out infinite; }
      .orb2 { animation: float 8s ease-in-out infinite reverse; }
      .badge { transform-box: fill-box; transform-origin: center; animation: bounce 2.6s ease-in-out infinite; }
      .tag { transform-box: fill-box; transform-origin: center; animation: pulse 1.8s ease-in-out infinite; }
      .cta { animation: blink 1.6s ease-in-out infinite; }
      .chip { animation: rise 0.9s ease-out both; }
      .c2 { animation-delay: 0.2s; }
      .c3 { animation-delay: 0.4s; }
      @keyframes march { to { stroke-dashoffset: -48; } }
      @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-14px); } }
      @keyframes bounce { 0%,100% { transform: translateY(0) rotate(-3deg); } 50% { transform: translateY(-8px) rotate(3deg); } }
      @keyframes pulse { 0%,100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.08); opacity: 0.8; } }
      @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }
      @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
  </defs>

  <rect x="2" y="2" width="896" height="276" rx="22" fill="url(#bg)"/>
  <rect class="border" x="6" y="6" width="888" height="268" rx="19" fill="none" stroke="url(#accent)" stroke-width="2"/>

  <circle class="orb1" cx="780" cy="70" r="90" fill="#58a6ff" opacity="0.08"/>
  <circle class="orb2" cx="680" cy="230" r="60" fill="#a371f7" opacity="0.10"/>

  <g class="badge">
    <circle cx="120" cy="140" r="72" fill="#0d1117" stroke="url(#accent)" stroke-width="3"/>
    <ellipse cx="120" cy="165" rx="26" ry="21" fill="#58a6ff"/>
    <ellipse cx="82" cy="132" rx="11" ry="15" fill="#58a6ff" transform="rotate(-25 82 132)"/>
    <ellipse cx="104" cy="108" rx="11" ry="16" fill="#58a6ff" transform="rotate(-8 104 108)"/>
    <ellipse cx="136" cy="108" rx="11" ry="16" fill="#a371f7" transform="rotate(8 136 108)"/>
    <ellipse cx="158" cy="132" rx="11" ry="15" fill="#a371f7" transform="rotate(25 158 132)"/>
  </g>

  <g class="tag">
    <rect x="690" y="26" width="176" height="32" rx="16" fill="#f0883e"/>
    <text x="778" y="47" text-anchor="middle" font-size="14" font-weight="700" fill="#0d1117">★ FEATURED PROJECT</text>
  </g>

  <text x="230" y="118" font-size="56" font-weight="800" fill="url(#accent)">QuizPup</text>
  <text x="230" y="156" font-size="20" fill="#c9d1d9">Your AI study buddy for JEE · NEET · CAT</text>

  <g class="chip">
    <rect x="230" y="180" width="190" height="34" rx="17" fill="#1f6feb" opacity="0.25" stroke="#58a6ff"/>
    <text x="325" y="202" text-anchor="middle" font-size="14" fill="#e6edf3">AI-generated quizzes</text>
  </g>
  <g class="chip c2">
    <rect x="432" y="180" width="150" height="34" rx="17" fill="#1f6feb" opacity="0.25" stroke="#58a6ff"/>
    <text x="507" y="202" text-anchor="middle" font-size="14" fill="#e6edf3">600+ flashcards</text>
  </g>
  <g class="chip c3">
    <rect x="594" y="180" width="170" height="34" rx="17" fill="#8957e5" opacity="0.25" stroke="#a371f7"/>
    <text x="679" y="202" text-anchor="middle" font-size="14" fill="#e6edf3">OCR SuperNotes</text>
  </g>

  <text class="cta" x="230" y="252" font-size="16" font-weight="600" fill="#58a6ff">Click to try it live →</text>
</svg>